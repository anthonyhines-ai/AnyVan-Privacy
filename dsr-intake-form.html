<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(180deg,#f0f4f8 0%,#fff 40%);min-height:100vh;color:#1d2939}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hdr{padding:28px 0 20px;text-align:center}
.hdr-logo{font-size:26px;font-weight:700;color:#1a3a5c;letter-spacing:-.5px}
.hdr-sub{font-size:16px;font-weight:500;color:#667085;margin-top:4px}
.test-banner{background:#fef6ee;border:1.5px solid #f9dbaf;border-radius:8px;padding:10px 16px;text-align:center;font-size:13px;color:#93370d;font-weight:600;margin-bottom:16px}
.steps{display:flex;align-items:center;justify-content:center;margin-bottom:12px}

h2{font-size:20px;font-weight:700;color:#1a3a5c;margin-bottom:8px}

.cb-group{display:flex;flex-direction:column;gap:8px}

.cb-item.sel{border-color:#1a3a5c;background:#f0f5fa}

.cb-item input{margin-top:2px;accent-color:#1a3a5c}
.panel{padding:20px;background:#f8fafc;border-radius:10px;border:1px solid #e4e7ec;margin-top:16px}
.call-panel{margin-top:16px;padding:20px;background:#fff;border-radius:10px;border:1.5px solid #1a3a5c}
.call-panel h3{font-size:14px;font-weight:700;color:#1a3a5c;margin-bottom:4px}
.call-panel .hint{font-size:12.5px;color:#667085;line-height:1.5;margin-bottom:14px}
.call-row{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:10px;align-items:end;padding:14px 16px;background:#fff;border-radius:8px;border:1px solid #e4e7ec;margin-bottom:10px}
.call-row label{font-size:12px;font-weight:600;color:#667085;margin-bottom:4px;display:block}
.call-row input{padding:8px 10px;border-radius:6px;border:1.5px solid #d0d5dd;font-size:13px;font-family:inherit;color:#1d2939;width:100%}
.rm-btn{padding:8px 10px;border-radius:6px;border:1.5px solid #fecdca;background:#fef3f2;color:#912018;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.rm-btn:disabled{background:#f9fafb;color:#d0d5dd;border-color:#e4e7ec;cursor:not-allowed}
.add-call-btn{margin-top:12px;padding:8px 16px;border-radius:6px;border:1.5px dashed #1a3a5c;background:transparent;color:#1a3a5c;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.add-call-btn:hover{background:#f0f5fa}
.note-box{padding:10px 14px;border-radius:6px;font-size:12.5px;line-height:1.5;margin-top:14px}
.note-amber{background:#fef6ee;border:1px solid #f9dbaf;color:#93370d}
.note-red{background:#fef3f2;border:1px solid #fecdca;color:#912018}
.note-green{background:#f0f9f4;border:1px solid #b5e3c4;color:#1a5632}
.note-blue{background:#f8fafc;border:1px solid #e4e7ec;color:#344054}
.friction-box{padding:20px;background:#fffcf5;border:1.5px solid #f2d16b;border-radius:10px;margin-top:16px}
.friction-box h3{font-size:14px;font-weight:600;color:#93370d;margin-bottom:6px}
.friction-box p{font-size:13px;color:#7a2e0e;line-height:1.5;margin-bottom:16px}
.friction-box label{font-size:12px;font-weight:600;color:#93370d;margin-bottom:4px;display:block}
.friction-box input,.friction-box textarea{border-color:#f2d16b;background:#fff}
.friction-date-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.chat-panel{margin-top:16px;padding:20px;background:#fff;border-radius:10px;border:1.5px solid #1a3a5c}
.chat-panel h3{font-size:14px;font-weight:700;color:#1a3a5c;margin-bottom:4px}
.chat-panel .hint{font-size:12.5px;color:#667085;line-height:1.5;margin-bottom:14px}
.ch-btn{padding:7px 14px;border-radius:6px;border:1.5px solid #d0d5dd;background:#fff;color:#667085;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;margin-right:8px;margin-bottom:8px}
.ch-btn.sel{border-color:#1a3a5c;background:#f0f5fa;color:#1a3a5c}
.review-grid{display:grid;grid-template-columns:140px 1fr;gap:10px 16px;font-size:14px;line-height:1.6}
.review-grid .lbl{font-weight:600;color:#667085}
.review-grid .val{color:#1d2939}
.review-grid .val.green{color:#12b76a;font-weight:600}
.decl-box{padding:20px;background:#fffcf5;border:1.5px solid #f2d16b;border-radius:10px;margin-top:24px}
.decl-box label{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.decl-box ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:#344054;line-height:1.6}
.nav-bar{display:flex;justify-content:space-between;margin-top:28px;padding-top:20px;border-top:1px solid #f2f4f7}
.nav-bar.end{justify-content:flex-end}
.btn{padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s}
.btn-back{border:1.5px solid #d0d5dd;background:#fff;color:#344054}
.btn-next{border:none;background:#1a3a5c;color:#fff}
.btn-next:disabled{background:#d0d5dd;color:#98a2b3;cursor:not-allowed}
.success{text-align:center;padding:40px 20px}
.success .tick{width:64px;height:64px;border-radius:50%;background:#d1fadf;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px}
.success h2{font-size:22px;margin-bottom:12px}
.success p{font-size:14.5px;color:#667085;line-height:1.6;max-width:440px;margin:0 auto 28px}
.success .sm{font-size:13px;color:#98a2b3;max-width:400px;margin:0 auto}
.test-output{margin-top:24px;padding:20px;background:#1d2939;border-radius:10px;text-align:left}
.test-output h3{font-size:13px;font-weight:600;color:#f2d16b;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.test-output pre{font-size:12px;color:#d1fae5;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-family:'SF Mono',Consolas,monospace}
.upload-zone{border:2px dashed #d0d5dd;border-radius:10px;padding:28px 20px;text-align:center;background:#fafbfc;cursor:pointer;transition:.15s}
.upload-zone:hover{border-color:#1a3a5c;background:#f0f5fa}
.upload-zone .icon{font-size:28px;margin-bottom:8px;opacity:.6}
.upload-zone .lbl{font-size:14px;font-weight:600;color:#1a3a5c;margin-bottom:4px}
.upload-zone .sub{font-size:12.5px;color:#98a2b3}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f0f9f4;border:1px solid #b5e3c4;border-radius:8px;font-size:13px;margin-top:8px}
.file-item .info{display:flex;align-items:center;gap:10px;min-width:0}
.file-item .name{font-weight:600;color:#1a3a5c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .size{font-size:11.5px;color:#667085}
.file-rm{padding:4px 8px;border-radius:4px;border:1px solid #fecdca;background:#fef3f2;color:#912018;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;margin-left:10px}
.ftr{text-align:center;padding:0 24px 32px;font-size:12px;color:#98a2b3;line-height:1.6}
.ftr a{color:#1a3a5c}
@media(max-width:600px){.call-row{grid-template-columns:1fr 1fr;}.call-row>div:nth-child(3){grid-column:span 2}.req-type-grid{grid-template-columns:1fr 1fr}}
</style>

<body av-track-source="dsr-intake-form">
<div class="wrap">
  <div class="hdr">
    <div class="hdr-logo">AnyVan</div>
    <div class="hdr-sub">Data Subject Request Form</div>
  </div>
  <div class="test-banner">⚠️ INTERNAL TEST MODE — Submissions are not sent to Freshdesk</div>
  <div id="step-indicator"></div>
  <div id="step-label" class="step-label"></div>
  <div class="card" id="form-card"></div>
  <div class="ftr">
    This form is processed in accordance with the <a href="https://www.anyvan.com/privacy-policy" target="_blank">AnyVan Privacy Policy</a> and UK GDPR.
    <br>For queries, contact <span style="color:#667085">privacy@anyvan.com</span>
  </div>
</div>
<script>
const S = {
  step:1, requesterType:'', requestType:'', tpType:'',
  fullName:'', email:'', phone:'', altPhone:'',
  companyName:'', tpId:'', listingRef:'',
  accountHolder:false, thirdPartyAuth:'', authFiles:[],
  sarDataTypes:[], callEntries:[{date:'',time:'',phone:''}],
  chatDateFrom:'', chatDateTo:'', chatChannels:[],
  allDataDateFrom:'', allDataDateTo:'', allDataReason:'',
  deletionScopes:[], rectificationFields:[], rectificationDetails:'',
  additionalInfo:'', declaration:false, submitted:false, result:null
};

// Set API_ENDPOINT to the deployed DSR backend (API Gateway) URL to enable live
// submission to Freshdesk. Leave empty ('') to keep the form in local test mode,
// which renders the JSON payload on screen instead of sending it anywhere.
const CONFIG = { API_ENDPOINT: '' };

const REQ_TYPES = [
  {id:'SAR',label:'Access My Data',desc:'Request a copy of the personal data AnyVan holds about you',icon:'📋'},
  {id:'DELETION',label:'Delete My Data',desc:'Request erasure of your personal data (Right to be Forgotten)',icon:'🗑️'},
  {id:'RECTIFICATION',label:'Correct My Data',desc:'Request correction of inaccurate or incomplete personal data',icon:'✏️'},
  {id:'MARKETING_OPT_OUT',label:'Marketing Opt-Out',desc:'Unsubscribe from marketing communications',icon:'📧'},
  {id:'PORTABILITY',label:'Data Portability',desc:'Receive your data in a portable, machine-readable format',icon:'📦'}
];
const SAR_TYPES = [
  {id:'booking_data',label:'Booking & account details'},
  {id:'call_recordings',label:'Call recordings'},
  {id:'chat_transcripts',label:'Chat transcripts (WhatsApp, Live Chat)'},
  {id:'email_correspondence',label:'Email correspondence'},
  {id:'payment_data',label:'Payment & transaction records'},
  {id:'all_data',label:'All personal data held'}
];
const DEL_SCOPES = [
  {id:'full_account',label:'Full account and all associated data'},
  {id:'booking_history',label:'Booking history only'},
  {id:'call_recordings_del',label:'Call recordings only'},
  {id:'chat_transcripts_del',label:'Chat transcripts only'},
  {id:'marketing_data',label:'Marketing/mailing list data only'}
];
const RECT_FIELDS = [
  {id:'name',label:'Name'},{id:'email',label:'Email address'},
  {id:'phone',label:'Phone number'},{id:'address',label:'Address'},
  {id:'other_field',label:'Other (specify below)'}
];
const STEP_LABELS = ['Requester Type','Your Details','Your Request','Declaration'];

function canProceed(){
  switch(S.step){
    case 1: return !!S.requesterType;
    case 2:
      if(!S.fullName||!S.email||!S.phone) return false;
      if(S.requesterType==='TP'&&!S.tpType) return false;
      if(S.requesterType==='TP'&&S.tpType==='limited'&&!S.companyName) return false;
      if((S.requesterType==='CUSTOMER'||S.requesterType==='TP')&&!S.accountHolder) return false;
      if(S.requesterType==='THIRD_PARTY'&&(!S.thirdPartyAuth||S.authFiles.length===0)) return false;
      return true;
    case 3:
      if(!S.requestType) return false;
      if(S.requestType==='SAR'){
        if(!S.sarDataTypes.length) return false;
        if(S.sarDataTypes.includes('call_recordings')&&!S.callEntries.every(e=>e.date&&e.time)) return false;
        if(S.sarDataTypes.includes('all_data')&&(!S.allDataDateFrom||!S.allDataDateTo||S.allDataReason.trim().length<20)) return false;
      }
      if(S.requestType==='DELETION'&&!S.deletionScopes.length) return false;
      if(S.requestType==='RECTIFICATION'&&(!S.rectificationFields.length||!S.rectificationDetails)) return false;
      return true;
    case 4: return S.declaration;
  }
  return false;
}

function render(){
  renderSteps();
  const card = document.getElementById('form-card');
  const lbl = document.getElementById('step-label');
  if(S.submitted){ card.innerHTML = renderSuccess(); lbl.textContent=''; document.getElementById('step-indicator').innerHTML=''; return; }
  lbl.textContent = STEP_LABELS[S.step-1];
  switch(S.step){
    case 1: card.innerHTML = renderStep1(); break;
    case 2: card.innerHTML = renderStep2(); break;
    case 3: card.innerHTML = renderStep3(); break;
    case 4: card.innerHTML = renderStep4(); break;
  }
  bindEvents();
}

function renderSteps(){
  if(S.submitted){document.getElementById('step-indicator').innerHTML='';return;}
  let h='<div class="steps">';
  for(let i=1;i<=4;i++){
    const cls = i<S.step?'step-dot done':i===S.step?'step-dot active':'step-dot';
    h+=`<div class="${cls}">${i<S.step?'✓':i}</div>`;
    if(i<4) h+=`<div class="step-line${i<S.step?' done':''}"></div>`;
  }
  h+='</div>';
  document.getElementById('step-indicator').innerHTML=h;
}

function renderStep1(){
  const opts=[
    {id:'CUSTOMER',label:'Customer',desc:'I used AnyVan to arrange a move or delivery',icon:'👤'},
    {id:'TP',label:'Transport Partner',desc:'I provide transport services through AnyVan',icon:'🚛'},
    {id:'THIRD_PARTY',label:'Authorised Third Party',desc:"I'm acting on behalf of someone else (e.g. solicitor, family member)",icon:'📝'}
  ];
  let h='<h2>Who is making this request?</h2><p class="desc">Select the category that best describes you.</p><div style="margin-top:24px">';
  opts.forEach(o=>{
    h+=`<button class="opt-btn${S.requesterType===o.id?' sel':''}" data-type="${o.id}"><span class="icon">${o.icon}</span><div><div class="lbl">${o.label}</div><div class="sub">${o.desc}</div></div></button>`;
  });
  h+='</div>'+navBar();
  return h;
}

function renderStep2(){
  const isTP=S.requesterType==='TP', is3P=S.requesterType==='THIRD_PARTY', isCust=S.requesterType==='CUSTOMER';
  let h='<h2>Your Details</h2><p class="desc">We need this information to verify your identity and locate your data.</p>';
  h+='<p class="req-hint">Fields marked with <span>*</span> are required.</p>';
  h+=field(isCust||isTP?'Your Full Name':'Full Name of Data Subject',true,'','text','fullName',S.fullName,'As registered with AnyVan');
  h+=field('Email Address',true,'The email associated with your AnyVan account','email','email',S.email,'you@example.com');
  h+=field('Phone Number',true,'The primary number associated with your AnyVan account','tel','phone',S.phone,'+44 7xxx xxx xxx');
  h+=field('Alternative Phone Number',false,'Any other number you may have used with AnyVan','tel','altPhone',S.altPhone,'+44 7xxx xxx xxx');
  if(isTP){
    h+='<div class="field"><span class="field-lbl">Business Type<span class="req">*</span></span><p class="field-hint">Select the structure of your transport business</p><div class="tp-type-row">';
    h+=`<button class="tp-type-btn${S.tpType==='sole_trader'?' sel':''}" data-tptype="sole_trader"><div class="lbl">Sole Trader</div><div class="sub">I operate as an individual</div></button>`;
    h+=`<button class="tp-type-btn${S.tpType==='limited'?' sel':''}" data-tptype="limited"><div class="lbl">Limited Company / Partnership</div><div class="sub">Registered business entity</div></button>`;
    h+='</div></div>';
    if(S.tpType==='sole_trader') h+=field('Trading Name',false,'If you trade under a name different from your own (optional)','text','companyName',S.companyName,'e.g. Smith Removals');
    if(S.tpType==='limited') h+=field('Registered Company / Partnership Name',true,'','text','companyName',S.companyName,'As registered with Companies House');
    if(S.tpType) h+=field('Transport Partner Username',false,'Your login username for the AnyVan partner portal','text','tpId',S.tpId,'e.g. jsmith_transport');
  }
  if(is3P){
    h+='<div class="field"><span class="field-lbl">Authorisation Details<span class="req">*</span></span><p class="field-hint">Describe your authority to act on behalf of the data subject.</p>';
    h+=`<textarea rows="3" data-field="thirdPartyAuth" placeholder="Your relationship to the data subject and basis for authorisation (e.g. I am the data subject's solicitor acting under instruction, I hold power of attorney)">${esc(S.thirdPartyAuth)}</textarea></div>`;
    h+='<div class="field"><span class="field-lbl">Proof of Authorisation<span class="req">*</span></span><p class="field-hint">Upload supporting documentation such as a signed authority letter, power of attorney, or court order. Accepted formats: PDF, JPG, PNG (max 10MB per file).</p>';
    h+='<div class="upload-zone" id="upload-zone"><div class="icon">📎</div><div class="lbl">Click to upload or drag and drop</div><div class="sub">PDF, JPG or PNG — max 10MB per file</div></div>';
    h+='<input type="file" id="file-input" multiple accept=".pdf,.jpg,.jpeg,.png" style="display:none">';
    if(S.authFiles.length){
      S.authFiles.forEach((f,i)=>{
        h+=`<div class="file-item"><div class="info"><span style="font-size:16px">${f.type==='application/pdf'?'📄':'🖼️'}</span><div><div class="name">${esc(f.name)}</div><div class="size">${Math.round(f.size/1024)} KB</div></div></div><button class="file-rm" data-rm="${i}">Remove</button></div>`;
      });
    }
    h+='</div>';
  }
  h+=field('AnyVan Booking Reference',false,'If your request relates to a specific booking (e.g. AV1234567)','text','listingRef',S.listingRef,'e.g. AV1234567');
  if(isCust||isTP){
    const chk=S.accountHolder;
    let txt=isCust?'I confirm that the details provided above are registered to my AnyVan customer account and that I am the person authorised to make this request.':
      S.tpType==='sole_trader'?'I confirm that I am the individual sole trader registered to this Transport Partner account on AnyVan and that the personal data associated with this account relates to me.':
      'I confirm that I am the registered account holder or an authorised director/officer for this Transport Partner account on the AnyVan platform and that I am authorised to make this request on behalf of the business.';
    h+=`<div class="confirm-box${chk?' checked':''}" id="confirm-box-wrap"><label><input type="checkbox" id="accountHolder" ${chk?'checked ':''}style="margin-top:3px;accent-color:#1a3a5c;transform:scale(1.15)"><div><strong>I confirm I am the account holder</strong><p>${txt}</p></div></label></div>`;
  }
  h+=navBar();
  return h;
}

function renderStep3(){
  const isAll=S.sarDataTypes.includes('all_data');
  let h='<h2>What would you like us to do?</h2><p class="desc">Select the type of request and provide details.</p><div class="req-type-grid">';
  REQ_TYPES.forEach(r=>{
    h+=`<button class="req-type-btn${S.requestType===r.id?' sel':''}" data-reqtype="${r.id}"><div class="icon">${r.icon}</div><div class="lbl">${r.label}</div><div class="sub">${r.desc}</div></button>`;
  });
  h+='</div>';
  if(S.requestType==='SAR'){
    h+='<div class="panel"><div class="field"><span class="field-lbl">What data would you like to access?<span class="req">*</span></span><p class="field-hint">Select specific categories for a faster response, or \'All personal data held\' for a comprehensive search.</p><div class="cb-group">';
    SAR_TYPES.forEach(t=>{
      const sel=S.sarDataTypes.includes(t.id), dis=isAll&&t.id!=='all_data';
      h+=`<label class="cb-item${sel?' sel':''}${dis?' disabled':''}"><input type="checkbox" data-sar="${t.id}" ${sel?'checked':''}${dis?' disabled':''}><span>${t.label}</span></label>`;
    });
    h+='</div></div>';
    if(S.sarDataTypes.includes('call_recordings')) h+=renderCallPanel();
    if(S.sarDataTypes.includes('chat_transcripts')) h+=renderChatPanel();
    if(isAll) h+=renderFrictionPanel();
    h+='</div>';
  }
  if(S.requestType==='DELETION'){
    h+='<div class="panel"><div class="field"><span class="field-lbl">What data would you like deleted?<span class="req">*</span></span><p class="field-hint">Select all that apply</p><div class="cb-group">';
    DEL_SCOPES.forEach(t=>{
      const sel=S.deletionScopes.includes(t.id);
      h+=`<label class="cb-item${sel?' sel':''}"><input type="checkbox" data-del="${t.id}" ${sel?'checked':''}><span>${t.label}</span></label>`;
    });
    h+='</div></div><div class="note-box note-red" style="margin-top:12px"><strong>Important:</strong> Some data may be retained where AnyVan has a legal obligation (e.g. financial records, fraud prevention, active disputes). We will inform you if any exemptions apply.</div></div>';
  }
  if(S.requestType==='RECTIFICATION'){
    h+='<div class="panel"><div class="field"><span class="field-lbl">Which data needs correcting?<span class="req">*</span></span><div class="cb-group">';
    RECT_FIELDS.forEach(t=>{
      const sel=S.rectificationFields.includes(t.id);
      h+=`<label class="cb-item${sel?' sel':''}"><input type="checkbox" data-rect="${t.id}" ${sel?'checked':''}><span>${t.label}</span></label>`;
    });
    h+='</div></div><div class="field"><span class="field-lbl">Please provide the correct information<span class="req">*</span></span><p class="field-hint">State what is currently incorrect and what it should be changed to</p>';
    h+=`<textarea rows="3" data-field="rectificationDetails" placeholder="e.g. My phone number is recorded as 07123456789 but should be 07987654321">${esc(S.rectificationDetails)}</textarea></div></div>`;
  }
  if(S.requestType==='MARKETING_OPT_OUT'){
    h+='<div class="note-box note-green" style="font-size:13.5px;padding:16px 20px;border-radius:10px">We will remove you from all AnyVan marketing communications including email, SMS, and push notifications. This does not affect transactional messages related to active bookings.</div>';
  }
  if(S.requestType==='PORTABILITY'){
    h+='<div class="note-box note-blue" style="font-size:13.5px;padding:16px 20px;border-radius:10px">We will provide your personal data in a structured, commonly used, machine-readable format (CSV or JSON) within one calendar month.</div>';
  }
  if(S.requestType){
    h+='<div class="field" style="margin-top:20px"><span class="field-lbl">Additional Information</span><p class="field-hint">Anything else that may help us process your request (e.g. specific interactions, reference numbers)</p>';
    h+=`<textarea rows="3" data-field="additionalInfo" placeholder="Optional — provide any additional context">${esc(S.additionalInfo)}</textarea></div>`;
  }
  h+=navBar();
  return h;
}

function renderCallPanel(){
  let h='<div class="call-panel"><h3>Call Recording Details</h3><p class="hint">Provide the date and approximate time of each call you are requesting. We require this information to locate specific recordings across our telephony systems.</p>';
  S.callEntries.forEach((e,i)=>{
    h+=`<div class="call-row"><div><label>Date of call *</label><input type="date" data-call-date="${i}" value="${e.date}"></div><div><label>Approx. time *</label><input type="time" data-call-time="${i}" value="${e.time}"></div><div><label>Phone number used</label><input type="tel" data-call-phone="${i}" value="${esc(e.phone)}" placeholder="Number you called from/to"></div><div><button class="rm-btn" data-call-rm="${i}"${S.callEntries.length===1?' disabled':''}>✕</button></div></div>`;
  });
  h+=`<button class="add-call-btn" id="add-call">+ Add another call</button>`;
  h+='<div class="note-box note-amber"><strong>Note:</strong> Call recordings are retained for a limited period. Recordings older than the retention period may no longer be available. Providing accurate dates and times significantly increases the likelihood of locating your recordings.</div></div>';
  return h;
}

function renderChatPanel(){
  let h='<div class="chat-panel"><h3>Chat Transcript Details</h3><p class="hint">Help us locate your chat conversations by providing the date range and channels used.</p>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px"><div><label style="display:block;font-size:12px;font-weight:600;color:#667085;margin-bottom:4px">From date</label><input type="date" data-field="chatDateFrom" value="'+S.chatDateFrom+'"></div><div><label style="display:block;font-size:12px;font-weight:600;color:#667085;margin-bottom:4px">To date</label><input type="date" data-field="chatDateTo" value="'+S.chatDateTo+'"></div></div>';
  h+='<div><label style="display:block;font-size:12px;font-weight:600;color:#667085;margin-bottom:6px">Which channels? (select all that apply)</label><div>';
  ['WhatsApp','Live Chat (website)','Both / unsure'].forEach(ch=>{
    h+=`<button class="ch-btn${S.chatChannels.includes(ch)?' sel':''}" data-ch="${ch}">${ch}</button>`;
  });
  h+='</div></div></div>';
  return h;
}

function renderFrictionPanel(){
  let h='<div class="friction-box"><h3>Full data requests require additional detail</h3><p>To locate all personal data held across our systems, we need the information below. Incomplete requests may delay processing as we will need to contact you for clarification, which pauses the one-calendar-month response window.</p>';
  h+='<div class="friction-date-row"><div><label>Earliest interaction with AnyVan *</label><input type="date" data-field="allDataDateFrom" value="'+S.allDataDateFrom+'"></div><div><label>Most recent interaction *</label><input type="date" data-field="allDataDateTo" value="'+S.allDataDateTo+'"></div></div>';
  h+='<div><label>Reason for requesting all data held *</label><textarea rows="3" data-field="allDataReason" placeholder="Please explain why you require a copy of all personal data held by AnyVan. This helps us ensure we locate all relevant records across our systems.">'+esc(S.allDataReason)+'</textarea></div>';
  h+='<div class="note-box note-amber" style="margin-top:14px"><strong>Please note:</strong> Full data requests involve manual searches across multiple systems and may take the full one-calendar-month period to complete. If you only need specific records (e.g. call recordings or booking details), selecting those categories individually will result in a faster response.</div></div>';
  return h;
}

function renderStep4(){
  const rt=REQ_TYPES.find(r=>r.id===S.requestType);
  const rType=S.requesterType==='CUSTOMER'?'Customer':S.requesterType==='TP'?(S.tpType==='sole_trader'?'Transport Partner (Sole Trader)':'Transport Partner (Ltd / Partnership)'):'Authorised Third Party';
  let h='<h2>Review & Declaration</h2><p class="desc">Please review your request and confirm the declaration below.</p>';
  h+='<div style="background:#f8fafc;border-radius:10px;border:1px solid #e4e7ec;padding:20px;margin-top:16px"><div class="review-grid">';
  h+=rv('Requester',rType)+rv('Name',S.fullName)+rv('Email',S.email)+rv('Phone',S.phone+(S.altPhone?' / '+S.altPhone:''));
  if(S.requesterType==='TP'&&(S.companyName||S.tpId)){
    h+=rv(S.tpType==='sole_trader'?'Trading Name':'Company',(S.companyName||'—')+(S.tpId?' (@'+S.tpId+')':''));
  }
  const ref=S.listingRef?(/^\d/.test(S.listingRef)?'AV'+S.listingRef:S.listingRef):'';
  if(ref) h+=rv('Booking Ref',ref);
  if(S.requesterType==='CUSTOMER'||S.requesterType==='TP') h+='<span class="lbl">Account Holder</span><span class="val green">✓ Confirmed</span>';
  if(S.requesterType==='THIRD_PARTY'&&S.authFiles.length) h+=rv('Authorisation',S.authFiles.map(f=>f.name).join(', '));
  h+=rv('Request Type',rt?rt.label:S.requestType);
  if(S.requestType==='SAR'&&S.sarDataTypes.length) h+=rv('Data Requested',S.sarDataTypes.map(id=>SAR_TYPES.find(t=>t.id===id)?.label).join(', '));
  if(S.requestType==='SAR'&&S.sarDataTypes.includes('call_recordings')){
    const calls=S.callEntries.filter(e=>e.date).map(e=>{
      const d=new Date(e.date+'T'+(e.time||'00:00'));
      return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+(e.time?' ~'+e.time:'')+(e.phone?' ('+e.phone+')':'');
    }).join(' · ');
    if(calls) h+=rv('Calls',calls);
  }
  if(S.requestType==='DELETION'&&S.deletionScopes.length) h+=rv('Deletion Scope',S.deletionScopes.map(id=>DEL_SCOPES.find(t=>t.id===id)?.label).join(', '));
  h+='</div></div>';
  h+='<div class="decl-box"><label><input type="checkbox" id="declaration" '+(S.declaration?'checked':'')+' style="margin-top:3px;accent-color:#1a3a5c;transform:scale(1.2)"><div><strong>I declare that:</strong><ul>';
  h+='<li>The information I have provided is accurate and complete.</li>';
  h+='<li>I am the data subject, or I am duly authorised to act on their behalf and can provide proof of authorisation on request.</li>';
  h+='<li>I understand AnyVan will verify my identity before processing this request and may contact me for additional information.</li>';
  h+='<li>I understand this request will be processed within <strong>one calendar month</strong> of identity verification, in accordance with UK GDPR Article 12(3).</li>';
  h+='<li>AnyVan accepts no liability if data is intercepted or viewed by an unintended recipient once sent to the address provided.</li>';
  h+='</ul></div></label></div>';
  h+=navBar();
  return h;
}

function renderSuccess(){
  const ref=(S.result&&S.result.reference)||('DSR-'+Date.now().toString(36).toUpperCase());
  let h='<div class="success"><div class="tick">✓</div><h2>Request Submitted</h2>';
  h+=`<p>Your data request has been received and assigned reference <strong style="color:#1a3a5c">${ref}</strong>. We will verify your identity and respond within <strong>one calendar month</strong>.</p>`;
  h+='<p class="sm">If you need to follow up, reply to the confirmation email or contact <span style="color:#1a3a5c;font-weight:500">privacy@anyvan.com</span></p>';
  // Show the raw payload only in test mode (no live backend configured).
  if(!CONFIG.API_ENDPOINT){
    const payload=buildPayload(ref);
    h+='<div class="test-output"><h3>🧪 Test Mode — Freshdesk Payload</h3><pre>'+esc(JSON.stringify(payload,null,2))+'</pre></div>';
  }
  h+='</div>';
  return h;
}

function buildPayload(ref){
  const p={
    dsr_reference:ref,
    submitted_at:new Date().toISOString(),
    requester_type:S.requesterType,
    tp_business_type:S.requesterType==='TP'?S.tpType:undefined,
    full_name:S.fullName,
    email:S.email,
    phone:S.phone,
    alt_phone:S.altPhone||undefined,
    company_name:S.companyName||undefined,
    tp_username:S.tpId||undefined,
    booking_reference:S.listingRef?(/^\d/.test(S.listingRef)?'AV'+S.listingRef:S.listingRef):undefined,
    account_holder_confirmed:S.requesterType!=='THIRD_PARTY'?true:undefined,
    third_party_auth:S.requesterType==='THIRD_PARTY'?S.thirdPartyAuth:undefined,
    auth_files:S.requesterType==='THIRD_PARTY'?S.authFiles.map(f=>({name:f.name,size:f.size,type:f.type})):undefined,
    request_type:S.requestType,
    freshdesk_tags:['privacy','dsr',S.requestType.toLowerCase(),S.requesterType.toLowerCase(),'source:dsr-form','account-holder-confirmed'],
  };
  if(S.requestType==='SAR'){
    p.sar_data_types=S.sarDataTypes;
    if(S.sarDataTypes.includes('call_recordings')) p.call_entries=S.callEntries.filter(e=>e.date);
    if(S.sarDataTypes.includes('chat_transcripts')) p.chat_request={date_from:S.chatDateFrom,date_to:S.chatDateTo,channels:S.chatChannels};
    if(S.sarDataTypes.includes('all_data')) p.all_data_request={date_from:S.allDataDateFrom,date_to:S.allDataDateTo,reason:S.allDataReason};
  }
  if(S.requestType==='DELETION') p.deletion_scopes=S.deletionScopes;
  if(S.requestType==='RECTIFICATION'){p.rectification_fields=S.rectificationFields;p.rectification_details=S.rectificationDetails;}
  if(S.additionalInfo) p.additional_info=S.additionalInfo;
  // Clean undefined
  Object.keys(p).forEach(k=>p[k]===undefined&&delete p[k]);
  return p;
}

// Read a File as base64 (strips the data: URI prefix) for attachment pass-through.
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result).split(',')[1]||'');
    r.onerror=()=>reject(r.error||new Error('read failed'));
    r.readAsDataURL(file);
  });
}

// Build the payload for live submission: same as the test payload, but third-party
// authorisation files carry their base64 content so the backend can attach them.
async function buildSubmitPayload(ref){
  const p=buildPayload(ref);
  if(S.requesterType==='THIRD_PARTY'&&S.authFiles.length){
    p.auth_files=await Promise.all(S.authFiles.map(async f=>({
      name:f.name, size:f.size, type:f.type, content_base64:await fileToBase64(f)
    })));
  }
  return p;
}

// Submit the request. In test mode (no CONFIG.API_ENDPOINT) this resolves immediately
// with a client-generated reference; otherwise it POSTs to the backend and returns the
// server-issued reference. Never throws — returns {ok:false,error} on failure.
async function submitRequest(){
  const clientRef='DSR-'+Date.now().toString(36).toUpperCase();
  if(!CONFIG.API_ENDPOINT){ return {ok:true, testMode:true, reference:clientRef}; }
  try{
    const payload=await buildSubmitPayload(clientRef);
    const res=await fetch(CONFIG.API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json().catch(()=>({}));
    return {ok:true, reference:data.dsr_reference||clientRef, ticketId:data.ticket_id};
  }catch(e){ return {ok:false, error:(e&&e.message)||'network error'}; }
}

function rv(l,v){return `<span class="lbl">${l}</span><span class="val">${esc(v)}</span>`;}
function field(label,req,hint,type,name,val,ph){
  let h=`<div class="field"><span class="field-lbl">${label}${req?'<span class="req">*</span>':''}</span>`;
  if(hint) h+=`<p class="field-hint">${hint}</p>`;
  h+=`<input type="${type}" data-field="${name}" value="${esc(val)}" placeholder="${ph}"></div>`;
  return h;
}
function navBar(){
  const dis=canProceed()?'':'disabled';
  if(S.step===1) return `<div class="nav-bar end"><button class="btn btn-next" ${dis} id="btn-next">Next</button></div>`;
  return `<div class="nav-bar"><button class="btn btn-back" id="btn-back">Back</button><button class="btn btn-next" ${dis} id="btn-next">${S.step===4?'Submit Request':'Next'}</button></div>`;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function bindEvents(){
  // Nav
  const next=document.getElementById('btn-next');
  const back=document.getElementById('btn-back');
  if(next) next.onclick=async()=>{
    if(!canProceed())return;
    if(S.step<4){S.step++;render();return;}
    next.disabled=true; next.textContent='Submitting…';
    const result=await submitRequest();
    if(!result.ok){
      next.disabled=false; next.textContent='Submit Request';
      alert('Sorry, something went wrong submitting your request. Please try again, or email privacy@anyvan.com. ('+result.error+')');
      return;
    }
    S.result=result; S.submitted=true; render();
  };
  if(back) back.onclick=()=>{if(S.step>1)S.step--;render();};

  // Step 1
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.requesterType=b.dataset.type;S.accountHolder=false;S.tpType='';S.companyName='';render();});

  // Step 2 text fields
  document.querySelectorAll('[data-field]').forEach(el=>{
    el.oninput=()=>{S[el.dataset.field]=el.value;updateNav();};
  });
  document.querySelectorAll('[data-tptype]').forEach(b=>b.onclick=()=>{S.tpType=b.dataset.tptype;if(S.tpType==='sole_trader')S.companyName='';render();});
  const ah=document.getElementById('accountHolder');
  if(ah) ah.onchange=()=>{S.accountHolder=ah.checked;render();};
  // Whole-box clickable: handle clicks on the confirm-box padding outside the <label>.
  // Clicks on the label (input + text) are handled natively by ah.onchange above, so we
  // ignore them here to avoid double-toggling the state.
  const cbw=document.getElementById('confirm-box-wrap');
  if(cbw&&ah) cbw.onclick=(e)=>{if(e.target.closest('label'))return;S.accountHolder=!S.accountHolder;render();};

  // File upload
  const uz=document.getElementById('upload-zone');
  const fi=document.getElementById('file-input');
  if(uz){
    uz.onclick=()=>fi.click();
    uz.ondragover=e=>{e.preventDefault();uz.style.borderColor='#1a3a5c';uz.style.background='#f0f5fa';};
    uz.ondragleave=e=>{e.preventDefault();uz.style.borderColor='#d0d5dd';uz.style.background='#fafbfc';};
    uz.ondrop=e=>{e.preventDefault();uz.style.borderColor='#d0d5dd';uz.style.background='#fafbfc';
      const files=Array.from(e.dataTransfer.files).filter(f=>['application/pdf','image/jpeg','image/png'].includes(f.type)&&f.size<=10*1024*1024);
      if(files.length){S.authFiles.push(...files);render();}
    };
  }
  if(fi) fi.onchange=()=>{const files=Array.from(fi.files).filter(f=>f.size<=10*1024*1024);if(files.length){S.authFiles.push(...files);render();}fi.value='';};
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.authFiles.splice(parseInt(b.dataset.rm),1);render();});

  // Step 3
  document.querySelectorAll('[data-reqtype]').forEach(b=>b.onclick=()=>{
    S.requestType=b.dataset.reqtype;S.sarDataTypes=[];S.deletionScopes=[];S.rectificationFields=[];
    S.callEntries=[{date:'',time:'',phone:''}];render();
  });
  document.querySelectorAll('[data-sar]').forEach(el=>{
    el.onchange=()=>{
      const id=el.dataset.sar;
      if(id==='all_data'&&el.checked){S.sarDataTypes=['all_data'];}
      else if(el.checked){S.sarDataTypes=S.sarDataTypes.filter(x=>x!=='all_data');if(!S.sarDataTypes.includes(id))S.sarDataTypes.push(id);}
      else{S.sarDataTypes=S.sarDataTypes.filter(x=>x!==id);}
      render();
    };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onchange=()=>{const id=el.dataset.del;if(el.checked)S.deletionScopes.push(id);else S.deletionScopes=S.deletionScopes.filter(x=>x!==id);updateNav();};
  });
  document.querySelectorAll('[data-rect]').forEach(el=>{
    el.onchange=()=>{const id=el.dataset.rect;if(el.checked)S.rectificationFields.push(id);else S.rectificationFields=S.rectificationFields.filter(x=>x!==id);updateNav();};
  });

  // Call entries
  document.querySelectorAll('[data-call-date]').forEach(el=>{el.oninput=()=>{S.callEntries[parseInt(el.dataset.callDate)].date=el.value;updateNav();};});
  document.querySelectorAll('[data-call-time]').forEach(el=>{el.oninput=()=>{S.callEntries[parseInt(el.dataset.callTime)].time=el.value;updateNav();};});
  document.querySelectorAll('[data-call-phone]').forEach(el=>{el.oninput=()=>{S.callEntries[parseInt(el.dataset.callPhone)].phone=el.value;};});
  document.querySelectorAll('[data-call-rm]').forEach(b=>{b.onclick=()=>{if(S.callEntries.length>1){S.callEntries.splice(parseInt(b.dataset.callRm),1);render();}};});
  const addCall=document.getElementById('add-call');
  if(addCall) addCall.onclick=()=>{S.callEntries.push({date:'',time:'',phone:''});render();};

  // Chat channels
  document.querySelectorAll('[data-ch]').forEach(b=>{b.onclick=()=>{const ch=b.dataset.ch;if(S.chatChannels.includes(ch))S.chatChannels=S.chatChannels.filter(x=>x!==ch);else S.chatChannels.push(ch);render();};});

  // Declaration
  const decl=document.getElementById('declaration');
  if(decl) decl.onchange=()=>{S.declaration=decl.checked;updateNav();};
}

function updateNav(){
  const btn=document.getElementById('btn-next');
  if(btn) btn.disabled=!canProceed();
}

window.addEventListener('load',async()=>{
  try{await AVDashboard.ensureAuthenticated();}catch(e){console.log('Auth skipped:',e);}
  render();
});
</script>
