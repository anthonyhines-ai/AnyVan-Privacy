AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  DSR Intake Form backend — a Lambda behind API Gateway that creates a Freshdesk
  ticket from a DSR form submission and returns the DSR reference. Creating the
  ticket emits FRESHDESK_TICKET_CREATED, which the existing workflow-system
  classifier consumes for routing.

Parameters:
  FreshdeskDomain:
    Type: String
    Description: Freshdesk subdomain (e.g. "anyvan") or full base URL.
  FreshdeskApiKeySecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret holding the Freshdesk API key (plaintext).
  FreshdeskGroupId:
    Type: String
    Default: ''
    Description: Optional Freshdesk group_id to assign DSR tickets to.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS allow-origin for the form (e.g. https://dashboards.anyvan.com).

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256

Resources:
  DsrIntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dsr-intake-to-freshdesk
      Handler: handler.handler
      CodeUri: ./
      Environment:
        Variables:
          FRESHDESK_DOMAIN: !Ref FreshdeskDomain
          # Resolved from Secrets Manager at deploy time. Alternatively read the
          # secret in code via the AWS SDK if you prefer runtime resolution.
          FRESHDESK_API_KEY: !Sub '{{resolve:secretsmanager:${FreshdeskApiKeySecretArn}}}'
          FRESHDESK_GROUP_ID: !Ref FreshdeskGroupId
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        Submit:
          Type: Api
          Properties:
            Path: /dsr
            Method: post
        Preflight:
          Type: Api
          Properties:
            Path: /dsr
            Method: options

Outputs:
  ApiEndpoint:
    Description: POST this URL from the DSR form (set as CONFIG.API_ENDPOINT).
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/dsr'
